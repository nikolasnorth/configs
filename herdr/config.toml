onboarding = false
# herdr configuration
# See `herdr --default-config` for the full list of options.

[theme]
name = "catppuccin-mocha"
auto_switch = false

[theme.custom]
active_row_bg = "#342d33"
selection_bg = "#46383a"

[terminal]
# new panes/tabs inherit cwd from the source pane/workspace
new_cwd = "follow"

[keys]
# matches tmux prefix (tmux/.tmux.conf)
prefix = "ctrl+space"

# pane navigation, matches tmux h/j/k/l
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# splits, matches tmux defaults: % = side-by-side, " = stacked
split_vertical = "prefix+%"
split_horizontal = "prefix+\""

# matches tmux rename-window
rename_tab = "prefix+,"

# matches tmux rename-session
rename_workspace = "prefix+$"

# prefix+w: j/k to navigate workspaces
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_up = "up"
navigate_pane_down = "down"

[ui]
# highlights, borders, nav UI (Claude Copper, matches Claude Code's accent)
accent = "#d77757"
sidebar_width = 26
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false

# blank row between sidebar entries for readability
[ui.sidebar.spaces]
row_gap = 1

[ui.sidebar.agents]
row_gap = 1

# Background notification popups: ask the outer terminal (Ghostty) to raise
# a desktop notification, so alerts surface on the local machine over SSH.
[ui.toast]
delivery = "terminal"

# Sounds are on by default; mute them and rely on the toast notifications.
[ui.sound]
enabled = false
