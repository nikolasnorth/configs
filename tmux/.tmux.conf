# ── General ──────────────────────────────────────────────────

# prefix: ctrl + space
unbind C-b
set -g prefix C-space
bind C-space send-prefix

# 256 color support
set -g default-terminal "tmux-256color"

# enable true color support and cursor shape passthrough
set -ga terminal-overrides ",xterm-ghostty:Tc:Ss=\\E[%p1%d q:Se=\\E[6 q"

# vim mode for copy mode
set -g mode-keys vi

# enable mouse (scroll, select panes, resize)
set -g mouse on

# scroll history
set-option -g history-limit 100000

# no escape delay (important for vim)
set -sg escape-time 0

# pass focus events to applications (needed for nvim autoread)
set -g focus-events on

# forward OSC 52 clipboard writes through tmux to the outer terminal
set -g set-clipboard on
set -gq allow-passthrough on

# start indexing at 1 (easier to reach)
set -g base-index 1
setw -g pane-base-index 1

# renumber windows when one closes
set -g renumber-windows on

# activity alerts in background windows
set -g monitor-activity on
set -g visual-activity off

# ── Key Bindings ─────────────────────────────────────────────

# reload config: prefix + r
bind r source-file ~/.tmux.conf \; display "Reloaded"

# navigate panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# splits in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# IDE layout: prefix + C
# left 25% = claude code, top-right 75% = nvim, bottom-right 20% = terminal
bind C new-window -c "~/" \; \
  split-window -h -p 75 -c "~/" \; \
  split-window -v -p 20 -c "~/" \; \
  select-pane -t 0

# ── Status Bar ───────────────────────────────────────────────

set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=white"
set -g status-left-length 60
set -g status-right-length 120

set -g status-left "#[fg=magenta,bold]#S#[default] #[fg=brightblack]│#[default] "
set -g window-status-format "#[fg=brightblack]#I:#W#[default]"
set -g window-status-current-format "#[fg=cyan,bold]#I:#W#[default]"
set -g window-status-separator "  "

# git branch for the active pane and highest local disk utilization
set -g status-right "#(~/.config/tmux/scripts/git_branch.sh '#{pane_current_path}') #[fg=brightblack]│#[default] #(~/.config/tmux/scripts/disk.sh)"
